<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo Culture Quiz">
  <defs>
    <linearGradient id="cq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#4b2fd6" />
    </linearGradient>
    <linearGradient id="cq-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe29a" />
      <stop offset="100%" stop-color="#ffc857" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#cq-bg)" />
  <circle cx="64" cy="58" r="40" fill="#ffffff" opacity="0.08" />

  <!-- Globe : la culture generale -->
  <circle cx="64" cy="60" r="34" fill="none" stroke="url(#cq-gold)" stroke-width="4" />
  <ellipse cx="64" cy="60" rx="15" ry="34" fill="none" stroke="url(#cq-gold)" stroke-width="3" opacity="0.75" />
  <path d="M32 48h64M32 72h64" stroke="url(#cq-gold)" stroke-width="3" opacity="0.75" stroke-linecap="round" />

  <!-- Point d'interrogation : le quiz -->
  <path
    d="M56 48a9 9 0 0 1 17.5 3c0 6-7.5 7.5-7.5 13"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
  />
  <circle cx="65.5" cy="76" r="4.5" fill="#ffffff" />
</svg>
